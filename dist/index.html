<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Случайные числа, розыгрыши по списку, пароли, команды и монетка.">
  <title>Numberly — генераторы</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="Numberly, главная">Numberly</a>
    <nav id="navigation" aria-label="Генераторы"></nav>
    <a class="bot-link" href="https://t.me/NumberGenTgBot" target="_blank" rel="noopener">Открыть бота <span aria-hidden="true">↗</span></a>
  </aside>
  <div class="shell">
    <header class="topbar">
      <a class="mobile-brand brand" href="#">Numberly</a>
      <div class="breadcrumb">Генераторы <span aria-hidden="true">/</span> <strong id="breadcrumb">Числа</strong></div>
      <div class="header-actions">
        <button class="toolbar-button" data-action="theme" aria-label="Оформление"><span data-icon="moon"></span><span>Оформление</span></button>
        <button class="toolbar-button" data-action="history" aria-label="История результатов"><span data-icon="history"></span><span>История</span></button>
      </div>
    </header>
    <main>
      <div class="tool-grid" id="tools" aria-label="Выберите генератор"></div>
      <section class="generator" aria-labelledby="tool-title">
        <div class="generator-heading"><h1 id="tool-title">Генератор чисел</h1><p id="tool-description"></p></div>
        <div class="generator-body">
          <form id="generator-form" novalidate>
            <div id="fields"></div>
            <p id="form-error" class="form-error" role="alert"></p>
            <button class="primary-button" type="submit"><span id="generate-label">Сгенерировать</span></button>
          </form>
          <div class="result-panel">
            <h2 class="result-label">Результат</h2>
            <div id="result" class="result" aria-live="polite" aria-atomic="true"></div>
            <p id="result-meta" class="result-meta" hidden></p>
            <div class="result-actions" hidden>
              <button type="button" id="copy-result" disabled><span data-icon="copy"></span>Копировать</button>
              <button type="button" id="save-result" disabled><span data-icon="download"></span>Скачать .txt</button>
            </div>
          </div>
        </div>
      </section>
      <footer><span>Работает без регистрации</span><div><button data-action="about">О приложении</button><button data-action="privacy">Данные</button></div></footer>
    </main>
  </div>
  <div id="modal-overlay" class="modal-overlay" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-heading"><h2 id="modal-title"></h2><button class="icon-button" data-action="close" aria-label="Закрыть">✕</button></header>
      <div id="modal-content"></div>
    </section>
  </div>
  <div id="toast" role="status" class="toast" hidden></div>
</body>
</html>
